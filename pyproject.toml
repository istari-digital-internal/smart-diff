[tool.poetry]
name = "smart-diff"
version = "2.0.0"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11,<3.13"
python-dotenv = "1.2.2"
requests = "2.32.4"

[tool.poetry.group.build.dependencies]
poethepoet = "0.37.0"
pyinstaller = "6.16.0"

[tool.poe.tasks]
build = "pyinstaller --clean --onefile --add-data system_prompt.txt:. --add-data html/report_template.html:html --name=smart_diff smart_diff.py"
