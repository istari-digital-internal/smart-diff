[tool.poetry]
name = "smart-diff"
version = "1.0.0"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11,<3.13"
python-dotenv = "*"
requests = "2.33.0"
poethepoet = "0.37.0"
pyinstaller = "6.16.0"
openpyxl = "*"
pdfplumber = "*"
python-docx = "*"
pillow = "12.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "8.4.1"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.poe.tasks]
build = "pyinstaller --clean --onefile --add-data system_prompt.txt:. --add-data html/report_template.html:html --name=smart_diff smart_diff.py"
